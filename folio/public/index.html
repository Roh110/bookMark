<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bookMARK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <a href="#/dashboard" class="logo">bookMARK</a>

  <div class="search-wrap" id="searchWrap">
    <input type="search" id="catalogSearch" placeholder="Search any book by title…"
           autocomplete="off" aria-label="Search books to add"
           aria-controls="searchResults" aria-expanded="false">
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <nav>
    <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
    <a href="#/library" data-nav="library">Library</a>
  </nav>
  <div class="user-area">
    <span id="userName"></span>
    <button class="btn ghost small" id="logoutBtn" type="button">Log out</button>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/app.js"></script>
</body>
</html>
